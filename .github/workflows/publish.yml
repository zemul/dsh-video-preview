name: Publish to npm

# 推送形如 v0.1.3 的 tag 时自动发布；也可在 Actions 页手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing 通过 OIDC 换取临时凭据，必须开 id-token: write。
      id-token: write
      # 发布结束后回填 provenance / 无需写仓库内容，contents 保持只读。
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          always-auth: true

      # Trusted Publishing (OIDC) 需要 npm >= 11.5.1；Node 22 自带 npm 10，
      # 必须显式升级到 11.5.1 及以上，否则会退回无凭据流程导致 E404。
      - name: Upgrade npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # 发布前跑一遍宿主路由回归测试，避免把坏版本发出去。
      - name: Run route tests
        run: node test/route.test.mjs

      - name: Publish
        run: npm publish --access public
